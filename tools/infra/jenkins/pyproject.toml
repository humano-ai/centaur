[project]
name = "jenkins"
description = "Jenkins CI (jenkins.humano.ai) — read build status and console logs, retrigger jobs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
jenkins = "centaur_tool_jenkins.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_jenkins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["jenkins.humano.ai"]
# JENKINS_AUTH holds base64("user:api-token"). The sandbox only sees a
# placeholder; iron-proxy swaps it inside the Authorization header.
secrets = [{type = "http", name = "JENKINS_AUTH", match_headers = ["Authorization"], hosts = ["jenkins.humano.ai"]}]
