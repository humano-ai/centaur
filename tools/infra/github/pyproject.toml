[project]
name = "github"
description = "GitHub access for git and gh in the sandbox (clone, push, PRs, checks)"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.12.0"]

[project.scripts]
github-auth = "centaur_tool_github.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_github"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["github.com", "api.github.com", "uploads.github.com", "codeload.github.com", "objects.githubusercontent.com"]
# The sandbox's GITHUB_TOKEN is a placeholder. gh sends it in Authorization;
# git presents it as the HTTP Basic password via gh's credential helper.
secrets = [{type = "http", name = "GITHUB_TOKEN", match_headers = ["Authorization"], hosts = ["github.com", "api.github.com", "uploads.github.com"]}]
