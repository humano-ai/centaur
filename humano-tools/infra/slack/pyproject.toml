[project]
name = "slack"
description = "Slack access for the sandbox: post messages and upload files (screenshots, evidence) to a thread"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "typer>=0.12.0"]

[project.scripts]
slack-post = "centaur_tool_slack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_slack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["slack.com", "api.slack.com", "files.slack.com"]
# The sandbox only sees a placeholder; iron-proxy swaps in the bot token for
# Slack's API hosts. File uploads need files:write on the Slack app.
secrets = [{type = "http", name = "SLACK_BOT_TOKEN", match_headers = ["Authorization"], hosts = ["slack.com", "api.slack.com", "files.slack.com"]}]
