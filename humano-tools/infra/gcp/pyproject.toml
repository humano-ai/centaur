[project]
name = "gcp"
description = "Bumi staging on GCP (read-only) — prove which build Cloud Run is serving, read service logs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
gcp = "centaur_tool_gcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_gcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = [
    "run.googleapis.com",
    "artifactregistry.googleapis.com",
    "logging.googleapis.com",
    "asia-southeast1-docker.pkg.dev",
]
# GCP_ACCESS_TOKEN is a short-lived OAuth token for
# fyndry-reader@bumi-platform-staging (run.viewer, artifactregistry.reader,
# logging.viewer — nothing that writes). A timer on the VM mints it by
# impersonation, so no service-account key exists anywhere. The sandbox only
# sees a placeholder; iron-proxy swaps it inside the Authorization header.
secrets = [{type = "http", name = "GCP_ACCESS_TOKEN", match_headers = ["Authorization"], hosts = [
    "run.googleapis.com",
    "artifactregistry.googleapis.com",
    "logging.googleapis.com",
    "asia-southeast1-docker.pkg.dev",
]}]
